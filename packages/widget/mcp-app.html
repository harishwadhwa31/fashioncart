<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Not cosmetic. Claude renders apps on a transparent stack; without color-scheme the browser
      paints its own opaque backdrop, which shows as a white slab in dark mode. Verified working
      in both themes (Phase 2 gate, probe 8).
    -->
    <meta name="color-scheme" content="light dark" />
    <title>FashionCart</title>
    <style>html,body{background:transparent;margin:0;padding:0}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
